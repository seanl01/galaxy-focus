name: Deploy bridge preview (main + /bridge)

# Publishes a combined GitHub Pages site so the bridge cockpit lives at its
# own URL without disturbing the main app:
#   /galaxy-focus/         -> main app (claude/focus-flight-galaxy-edition-f43dm1)
#   /galaxy-focus/bridge/  -> this branch (claude/cockpit-bridge-view)
# Both branches are built explicitly and assembled into one artifact.

on:
  push:
    branches:
      - claude/cockpit-bridge-view
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main app
        uses: actions/checkout@v4
        with:
          ref: claude/focus-flight-galaxy-edition-f43dm1
          path: main-src
      - name: Checkout bridge preview
        uses: actions/checkout@v4
        with:
          ref: claude/cockpit-bridge-view
          path: bridge-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build main app (site root)
        working-directory: main-src
        run: npm ci && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /galaxy-focus
      - name: Build bridge preview (/bridge)
        working-directory: bridge-src
        run: npm ci && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /galaxy-focus/bridge
      - name: Assemble combined site
        run: |
          mkdir -p site
          cp -r main-src/out/. site/
          rm -rf site/bridge
          cp -r bridge-src/out site/bridge
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
